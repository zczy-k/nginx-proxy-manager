# ─── NPM 管理面板 ──────────────────────────────────────────
# 此文件为配置参考，实际部署时由 setup.sh 动态生成到
# /etc/nginx/npm-conf.d/npm-admin.conf
# 并自动代入自定义端口号。
#
# 如需手动配置，替换 ${PORT_ADMIN} 和 ${PORT_BACKEND} 为实际值。

server {
    listen ${PORT_ADMIN};
    server_name _;
    charset utf-8;

    access_log /var/log/npm/admin-access.log;
    error_log /var/log/npm/admin-error.log warn;

    root /opt/nginx-proxy-manager/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:${PORT_BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:${PORT_BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /tokens/ {
        proxy_pass http://127.0.0.1:${PORT_BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
